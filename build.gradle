import com.diffplug.gradle.spotless.SpotlessTask

plugins {
    id 'java'
    id 'com.diffplug.spotless' version '6.25.0'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'org.gradle.test-retry' version '1.6.0'
    id 'org.sonarqube' version '6.0.1.5171'
    id 'io.qameta.allure' version '3.0.2'
}

def appProperties = new Properties()
file("src/main/resources/config/config.properties").withInputStream { stream ->
    appProperties.load(stream)
}

group = 'antifraud-test-automation'
version = '1.0'

// Configure the task to build the Generator REST API executable fatjar
shadowJar {
    archiveBaseName.set('generator')
    archiveVersion.set('0.1.0-SNAPSHOT')
    archiveClassifier.set('')
    mergeServiceFiles()

    manifest {
        attributes 'Main-Class': 'generator.app.Application'
    }
}

repositories {
    mavenCentral()
}

def ownerVersion = '1.0.12'
def playwrightVersion = '1.45.0'
def okhttpVersion = '4.12.0'
def javalinVersion = '6.3.0'
def sqliteVersion = '3.47.1.0'
def reflectionsVersion = '0.10.2'
def hamcrestVersion = '3.0'
def slf4jVersion = '2.0.12'
def junitBomVersion = '5.10.2'
def junitJupiterApiVersion = '5.10.3'
def allureBomVersion = '2.25.0'
def jacksonVersion = '2.17.2'
def postgresVersion = '42.7.3'
def mysqlVersion = '8.0.32'
def clickhouseVersion = '0.6.0'
def hikariVersion = '6.2.1'
def kafkaClientVersion = '3.6.0'
def imageComparisonVersion = '4.4.0'
def jsonVersion = '20240303'
def httpcomponentsVersion = '5.2.3'
def commonsConfigurationVersion = '1.7'
def fakerVersion = '2.4.1'
def lombokVersion = '1.18.34'

dependencies {
    // Junit
    implementation platform("org.junit:junit-bom:$junitBomVersion")
    implementation "org.junit.jupiter:junit-jupiter-api:$junitJupiterApiVersion"
    implementation group: 'commons-configuration', name: 'commons-configuration', version: "$commonsConfigurationVersion"
    implementation group: 'org.json', name: 'json', version: "$jsonVersion"

    //Playwright
    implementation "com.microsoft.playwright:playwright:$playwrightVersion"

    //Config
    implementation "org.aeonbits.owner:owner:$ownerVersion"

    //Rest api
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "io.javalin:javalin:$javalinVersion"
    implementation "org.xerial:sqlite-jdbc:$sqliteVersion"
    implementation "org.reflections:reflections:$reflectionsVersion"

    //Json parsing
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "com.fasterxml.jackson.core:jackson-core:$jacksonVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jacksonVersion"

    //Hamcrest matchers
    implementation "org.hamcrest:hamcrest:$hamcrestVersion"

    //Database
    implementation "org.postgresql:postgresql:$postgresVersion"
    implementation "mysql:mysql-connector-java:$mysqlVersion"
    implementation "com.clickhouse:clickhouse-jdbc:$clickhouseVersion"
    implementation "com.zaxxer:HikariCP:$hikariVersion"
    implementation "org.apache.httpcomponents.client5:httpclient5:$httpcomponentsVersion"

    //Allure
    implementation platform("io.qameta.allure:allure-bom:$allureBomVersion")
    implementation "io.qameta.allure:allure-junit5"
    implementation "org.junit.jupiter:junit-jupiter-api"
    runtimeOnly "org.junit.jupiter:junit-jupiter-engine"
    implementation "org.junit.jupiter:junit-jupiter"

    // slf4j
    implementation "org.slf4j:slf4j-simple:$slf4jVersion"

    //Kafka
    implementation "org.apache.kafka:kafka-clients:$kafkaClientVersion"

    //Visual testing
    implementation "com.github.romankh3:image-comparison:$imageComparisonVersion"

    //Faker
    implementation "net.datafaker:datafaker:$fakerVersion"

    //Logger
    implementation 'org.apache.logging.log4j:log4j-core:2.24.3'

    //Waits
    implementation 'org.awaitility:awaitility:4.3.0'

    compileOnly "org.projectlombok:lombok:$lombokVersion"
    annotationProcessor "org.projectlombok:lombok:$lombokVersion"
    testCompileOnly "org.projectlombok:lombok:$lombokVersion"
    testAnnotationProcessor "org.projectlombok:lombok:$lombokVersion"
}

spotless {
    java {
        removeUnusedImports()
        cleanthat()
                .addMutator('ErrorProneMutators')
                .addMutator('PMDMutators')
                .addMutator('SafeAndConsensual')
                .addMutator('SonarMutators')
                .addMutator('LocalVariableTypeInference')
                .addMutator('RemoveExplicitCallToSuper')
                .addMutator('UnnecessarySemicolon')
                .addMutator('UseTextBlocks')
        formatAnnotations()
        palantirJavaFormat()
    }
}

sonar {
    properties {
        property 'sonar.projectKey', 'antifraud-test-automation'
        property 'sonar.sources', 'src/main'
        property 'sonar.tests', 'src/test'
        property 'sonar.java.binaries', 'build/classes/java/main,build/classes/java/test'
    }
}

// Make sonar task depend on build task but skip tests
tasks.named('sonar').configure {
    dependsOn 'build'

    // Skip tests when running sonar
    gradle.taskGraph.whenReady { graph ->
        if (graph.hasTask(tasks.named('sonar').get())) {
            // Skip tests
            tasks.withType(Test).configureEach {
                enabled = false
            }

            // Skip Spotless code checks
            tasks.withType(SpotlessTask).configureEach {
                enabled = false
            }
        }
    }
}

tasks.register('compileOnly') {
    dependsOn 'testClasses'
}

tasks.register('createConsumerGroupsFile') {
    def group1 = appProperties.getProperty("testClusterKafkaConsumerGroup1")
    def group2 = appProperties.getProperty("testClusterKafkaConsumerGroup2")
    doFirst {
        def filePath = "src/main/resources/config/consumer-groups"
        def file = new File(filePath)

        // Write content to the file
        file.text = "$group1\n$group2"

        println "File created at: ${filePath}"
    }
}

tasks.withType(Test) {
    dependsOn(createConsumerGroupsFile)

    // Allow override via system property (e.g., -Dsequential.tests=true to run sequentially)
    def runSequential = System.getProperty('sequential.tests', 'false').toBoolean()
    maxParallelForks = runSequential ? 1 : 2

    // Other options
    testLogging {
        events "started", "passed", "failed", "skipped"
        // Do not show standard streams to avoid huge CI logs
        showStandardStreams = false
    }
}

tasks.register('installChromium', JavaExec) {
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install', 'chromium']
    classpath = sourceSets.main.runtimeClasspath
}

tasks.register('installDeps', JavaExec) {
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install-deps']
    classpath = sourceSets.main.runtimeClasspath
}

tasks.withType(Test).configureEach {
    if (System.getenv("IS_GITLAB_CI") == "true") {
        retry {
            maxRetries = 2
            failOnPassedAfterRetry = false // If true, fails the build if a test passes after retrying
        }
    }
    useJUnitPlatform {
        excludeTags 'manual' // Exclude tests tagged with "manual"
    }
}

test {
    useJUnitPlatform()
}

tasks.register('testSuiteSmoke', Test) {
    useJUnitPlatform() {
        includeTags 'suite_smoke'
    }
}

tasks.register('testSuiteSmokeProduction', Test) {
    useJUnitPlatform() {
        includeTags 'suite_smoke_production'
    }
}

tasks.register('testSmokeBackoffice', Test) {
    useJUnitPlatform() {
        includeTags 'team_backoffice'
    }
}

tasks.register('testSmokeCore', Test) {
    useJUnitPlatform() {
        includeTags "team_core"
    }
}

tasks.register('testClickhouseApiService', Test) {
    useJUnitPlatform() {
        includeTags "suite_clickhouse_api_service"
    }
}

tasks.register('testConnectionSearchApiService', Test) {
    useJUnitPlatform() {
        includeTags "suite_connection_search_service"
    }
}

tasks.register('testEventGeneratorService', Test) {
    useJUnitPlatform() {
        includeTags "suite_event_generator_service"
    }
}

tasks.register('testRuleEngineService', Test) {
    useJUnitPlatform() {
        includeTags "suite_rule_engine_rules_tests"
    }
}

tasks.register('testRunnerDebug', Test) {
    useJUnitPlatform() {
        includeTags 'debug_runner'
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java"] // include main sources and generated sources
        }
        resources {
            srcDirs = ["src/main/resources"]
        }
    }
    test {
        java {
            srcDirs = ["src/test/java"]
        }
        resources {
            srcDirs = ["src/test/resources"]
        }
    }
}
