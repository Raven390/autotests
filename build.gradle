plugins {
    id 'java'
    id 'com.github.sherter.google-java-format' version '0.9'
}

group = 'antifraud'
version = '1.0'

repositories {
    mavenCentral()
}

def ownerVersion = '1.0.12'
def playwrightVersion = '1.45.0'
def okhttpVersion = '4.12.0'
def hamcrestVersion = '3.0'
def slf4jVersion = '2.0.12'
def junitBomVersion = '5.10.2'
def allureBomVersion = '2.25.0'
def jacksonVersion = '2.17.2'
def postgreVersion = '42.1.4'
def kafkaClientVersion = '3.6.0'
def googleJavaFormatVersion = '1.23.0'

googleJavaFormat {
    toolVersion = "$googleJavaFormatVersion"
    options style: 'GOOGLE'
}

dependencies {
    implementation platform("org.junit:junit-bom:$junitBomVersion")
    implementation 'org.junit.jupiter:junit-jupiter-api:5.10.3'
    implementation group: 'commons-configuration', name: 'commons-configuration', version: '1.7'

    //Playwright
    implementation "com.microsoft.playwright:playwright:$playwrightVersion"

    //Config
    implementation "org.aeonbits.owner:owner:$ownerVersion"

    //Rest api
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"

    //Json parsing
    implementation "com.fasterxml.jackson.core:jackson-databind:$jacksonVersion"
    implementation "com.fasterxml.jackson.core:jackson-core:$jacksonVersion"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:$jacksonVersion"

    //Hamcrest matchers
    testImplementation "org.hamcrest:hamcrest:$hamcrestVersion"

    //Database
    implementation "org.postgresql:postgresql:$postgreVersion"

    //Allure for Junit 5 tests
    testImplementation platform ("io.qameta.allure:allure-bom:$allureBomVersion")
    testImplementation "io.qameta.allure:allure-junit5"
    testImplementation "org.junit.jupiter:junit-jupiter-api"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.slf4j:slf4j-simple:$slf4jVersion"

    //Kafka
    implementation "org.apache.kafka:kafka-clients:$kafkaClientVersion"
}

test {
    useJUnitPlatform()
}

task installChromium(type: JavaExec) {
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install','chromium']
    classpath = sourceSets.main.runtimeClasspath
}

task installDeps(type: JavaExec) {
    mainClass = 'com.microsoft.playwright.CLI'
    args = ['install-deps']
    classpath = sourceSets.main.runtimeClasspath
}