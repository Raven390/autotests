stages:
  - build
  - check
  - test

variables:
  # Set Playwright environment variable to skip installing Firefox and WebKit
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "true"
  DATA_GENERATOR: "true"
  REGISTRY_URL: "026090538932.dkr.ecr.us-east-1.amazonaws.com"
  DOCKER_HOST: "tcp://docker:2375"
  DOCKER_DRIVER: overlay2
  DOCKER_TLS_CERTDIR: ""
  AWS_DEFAULT_REGION: "us-east-1"
  CHART_PATH: https://gitlab.risk-vantagefx.com/api/v4/projects/417/packages/helm/stable
  CHART_NAME: java-app
  CHART_VERSION: 0.3.0
  HELM_TIMEOUT: 30s
  IMAGE_NAME: generator
  IMAGE_VERSION: 0.1.0-SNAPSHOT

default:
  services:
    - name: public.ecr.aws/docker/library/docker:dind
      alias: docker
      command: [ "--tls=false" ]

cache:
  key: "${CI_PROJECT_ID}-gradle"
  paths:
    - cache/caches/
    - cache/wrapper/
    - $CI_PROJECT_DIR/*/build/
    - $CI_PROJECT_DIR/*/build/*
    - $CI_PROJECT_DIR/*/build/**

workflow:
  rules:
    # Rule for nightly job
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_CORE_RUN == "true" && $CI_COMMIT_BRANCH == "main"'
      when: always
    # Rule for prod smoke job
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $PRODUCTION_SMOKE_RUN == "true"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_BACKOFFICE_RUN == "true" && $CI_COMMIT_BRANCH == "main"'
      when: always
    # Rule for jobs run on MR
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $APP_NAME == null'
      when: always  # Pipeline runs on merge requests
    # Push pipeline workflow (excluding main branch)
    - if: '$CI_COMMIT_BRANCH != "main" && $CI_PIPELINE_SOURCE == "push"'
      when: always  # Pipeline runs on non-main branch pushes
    # Rule for downstream pipeline for merges to services repos
    - if: '$APP_NAME != null'
      when: always
    # Rule for launching core tests from gitlab ui
    - if: '$CI_PIPELINE_SOURCE == "web" && $TESTS_GROUP == "core"'
      when: always
    # Rule for launching backoffice tests from gitlab ui
    - if: '$CI_PIPELINE_SOURCE == "web" && $TESTS_GROUP == "backoffice"'
      when: always
    - if: '$CI_COMMIT_BRANCH == "main" && $DATA_GENERATOR == "true" && $APP_NAME == null'
      when: always
    - if: '$PROD_TESTS == "true"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DEBUG_RUNNER == "true"'
      when: always
    # Default: Disable pipeline for other scenarios
    - when: never

job_build:
  timeout: 1 hour
  stage: build
  image: gradle:8.10.0-jdk22
  rules:
    - if: '$APP_NAME == null && $PROD_TESTS == null && $DEBUG_RUNNER != "true"'
  artifacts:
    when: always
    paths:
      - build/classes
  script:
    - echo "Building the project"
    - ./gradlew clean
    - ./gradlew build -x test -x spotlessCheck
    - echo "BUILD SUCCESS"

#Jobe for checking code format with spotless
job_code_check:
  timeout: 20 minutes
  stage: check
  needs: [ "job_build" ]
  image: gradle:8.10.0-jdk22
  rules:
    - if: '$APP_NAME == null && $PROD_TESTS == null && $DEBUG_RUNNER != "true"'
  script:
    - echo "Checking the code"
    - ./gradlew spotlessCheck
    - echo "CODE CHECK SUCCESS"

sonarqube-check:
  stage: check
  image: public.ecr.aws/docker/library/gradle:8.9-jdk21-jammy
  rules:
    - if: '$DEBUG_RUNNER != "true"'
  variables:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false --add-opens=java.base/java.lang=ALL-UNNAMED --add-opens=java.prefs/java.util.prefs=ALL-UNNAMED"
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
    SONAR_HOST: https://sonarqube.risk-utility.risk-vantagefx.com
  before_script:
    - export GRADLE_USER_HOME="$(pwd)/.gradle"
  cache:
    - key: "sonar-cache-$CI_COMMIT_REF_SLUG"
      policy: pull-push
      paths:
        - "${SONAR_USER_HOME}/cache"
        - sonar-scanner/
    - key: dep-cache
      paths:
        - .gradle
  interruptible: true
  script:
    - |
      gradle sonar -Dsonar.qualitygate.wait=true \
        -Dsonar.host.url=$SONAR_HOST \
        -Dsonar.projectVersion=$APP_VERSION
  allow_failure: false

# The test data generator API web application building
job_build_generator_jar:
  image: gradle:8.10.0-jdk22
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DATA_GENERATOR == "true" && $APP_NAME == null && $PROD_TESTS == null'
  needs: [ "job_build" ]
  variables:
    IMAGE_NAME: generator
    IMAGE_VERSION: 0.1.0-SNAPSHOT
  script:
    - ./gradlew shadowJar --info
  cache:
    - key: dep-cache
      paths:
        - .gradle
  artifacts:
    paths:
      - build/libs/*.jar
    expire_in: 3 days

# The test data generator API web application docker image publishing
job_publish_generator_image:
  image: public.ecr.aws/docker/library/docker:latest
  stage: build
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DATA_GENERATOR == "true" && $APP_NAME == null && $PROD_TESTS == null'
  needs: [ "job_build_generator_jar" ]
  before_script:
    - apk add aws-cli
  script:
    - aws ecr get-login-password | docker login --username AWS --password-stdin $REGISTRY_URL
    - aws ecr create-repository --repository-name $IMAGE_NAME --region $AWS_DEFAULT_REGION || true
    - docker build --rm --pull -q --build-arg JAR_NAME=$IMAGE_NAME-$IMAGE_VERSION -t $REGISTRY_URL/$IMAGE_NAME:$IMAGE_VERSION .
    - docker push -q $REGISTRY_URL/$IMAGE_NAME:$IMAGE_VERSION
    - docker rmi $REGISTRY_URL/$IMAGE_NAME:$IMAGE_VERSION

# The test data generator API web application deploying to K8S
job_deploy_generator:
  stage: build
  image: alpine/helm:3.15.4
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $DATA_GENERATOR == "true" && $APP_NAME == null && $PROD_TESTS == null'
  needs: [ "job_publish_generator_image" ]
  when: manual
  script:
    - helm repo add "$CHART_NAME" "$CHART_PATH"
    - helm repo update "$CHART_NAME"
    - helm pull "$CHART_NAME"/"$CHART_NAME" --version "$CHART_VERSION" --untar --untardir .helm
    - helm package --app-version="$IMAGE_VERSION" .helm/"$CHART_NAME"
    - helm upgrade "$IMAGE_NAME" "$CHART_NAME"-"$CHART_VERSION".tgz --version "$CHART_VERSION" --install --atomic --timeout $HELM_TIMEOUT -f values.yml --namespace test --set appVersion="$IMAGE_VERSION"

#Job for core team nightly tests
job_test_core:
  timeout: 3 hours
  stage: test
  needs: [ "job_build" ]
  image: gradle:8.10.0-jdk22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_CORE_RUN == "true" && $CI_COMMIT_BRANCH == "main" && $PROD_TESTS == null'
    - if: '$CI_PIPELINE_SOURCE == "web" && $TESTS_GROUP == "core" && $PROD_TESTS == null'
  variables:
    ALLURE_LAUNCH_NAME: "[Core team] Nightly run at $CI_PIPELINE_CREATED_AT"
    ALLURE_ENDPOINT: http://allure.vindex-test.risk-vantagefx.com/
    ALLURE_PROJECT_ID: 3
    ALLURE_RESULTS: allure-results
    RUNNER: "GITLAB_CI"
    TAG: 'team_core'
  before_script:
    - wget --output-document=allurectl --quiet https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
    - chmod +x allurectl
  script:
    - echo "Running tests"
    - ./gradlew installDeps
    - ./gradlew installChromium
    - ./allurectl watch -- gradle clean testSmokeCore
    - echo "TEST SUCCESS"
  artifacts:
    when: always
    paths:
      - playwright-report
      - build/reports/
      - allure-results
      - test-output/videos
    expire_in: 1 day

#Job for backoffice team nightly tests
job_test_backoffice:
  timeout: 4 hours
  stage: test
  needs: [ "job_build" ]
  image: gradle:8.10.0-jdk22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_BACKOFFICE_RUN == "true" && $CI_COMMIT_BRANCH == "main" && $PROD_TESTS == null'
    - if: '$CI_PIPELINE_SOURCE == "web" && $TESTS_GROUP == "backoffice" && $PROD_TESTS == null'
  variables:
    ALLURE_LAUNCH_NAME: "[Backoffice team] Nightly run at $CI_PIPELINE_CREATED_AT"
    ALLURE_ENDPOINT: http://allure.vindex-test.risk-vantagefx.com/
    ALLURE_PROJECT_ID: 4
    ALLURE_RESULTS: allure-results
    RUNNER: "GITLAB_CI"
  before_script:
    - wget --output-document=allurectl --quiet https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
    - chmod +x allurectl
    - chmod +x ./run-tests-and-lark-pub.sh
  script:
    - echo "Running tests"
    - ./gradlew installDeps
    - ./gradlew installChromium
    - |
      set +e
      echo "Trying TestOps wrapper script..."
      ./run-tests-and-lark-pub.sh testSmokeBackoffice
      WRAPPER_EXIT_CODE=$?

      if [ $WRAPPER_EXIT_CODE -ne 0 ]; then
        echo "Wrapper failed (exit=$WRAPPER_EXIT_CODE). Running tests without TestOps..."
        ./gradlew clean testSmokeBackoffice
        TEST_EXIT_CODE=$?
        exit $TEST_EXIT_CODE
      fi

      exit 0
  artifacts:
    when: always
    paths:
      - playwright-report
      - build/reports/
      - allure-results
      - test-output/
    expire_in: 1 day

job_debug_runner:
  stage: test
  image: gradle:8.10.0-jdk22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $DEBUG_RUNNER == "true"'
  variables:
    ALLURE_LAUNCH_NAME: "[Debug tests] run at $CI_PIPELINE_CREATED_AT"
    ALLURE_ENDPOINT: http://allure.vindex-test.risk-vantagefx.com/
    ALLURE_PROJECT_ID: 4
    ALLURE_RESULTS: allure-results
    RUNNER: "GITLAB_CI"
  before_script:
    - wget --output-document=allurectl --quiet https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
    - chmod +x allurectl
  script:
    - echo "Running tests"
    - ./gradlew installDeps
    - ./gradlew installChromium
    - ./gradlew clean
    - |
      set +e
      echo "Trying TestOps (allurectl watch)..."
      ./allurectl watch --results "$ALLURE_RESULTS" -- ./gradlew testRunnerDebug
      WATCH_EXIT_CODE=$?

      if [ $WATCH_EXIT_CODE -ne 0 ]; then
        echo "TestOps integration failed (exit=$WATCH_EXIT_CODE). Running tests without TestOps..."
        ./gradlew testRunnerDebug
        exit $?
      fi

      exit 0
  artifacts:
    when: always
    paths:
      - playwright-report
      - build/reports/
      - allure-results
      - test-output/
    expire_in: 1 day

#Job to launch tests by connected service
job_test_downstream_end_to_end:
  timeout: 3 hours
  stage: test
  image: gradle:8.10.0-jdk22
  rules:
    - if: '$APP_NAME != null && $PROD_TESTS == null'
      when: always
  variables:
    ALLURE_LAUNCH_NAME: "[Core team] Triggered by $APP_NAME"
    ALLURE_ENDPOINT: http://allure.vindex-test.risk-vantagefx.com/
    ALLURE_PROJECT_ID: 3
    ALLURE_RESULTS: allure-results
    RUNNER: "GITLAB_CI"
  before_script:
    - wget --output-document=allurectl --quiet https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
    - chmod +x allurectl
  script:
    - echo "Running tests"
    - |
      set +e

      run_with_optional_testops() {
        local task="$1"

        echo "Trying TestOps (allurectl watch) for task: ${task}"
        ./allurectl watch --results "$ALLURE_RESULTS" -- ./gradlew clean "${task}"
        local watch_code=$?

        if [ $watch_code -ne 0 ]; then
          echo "TestOps integration failed (exit=$watch_code). Running without TestOps: ${task}"
          ./gradlew clean "${task}"
          return $?
        fi

        return 0
      }

      if [ "$APP_NAME" == "event-generator" ]; then
        run_with_optional_testops "testEventGeneratorService"
        exit $?
      elif [ "$APP_NAME" == "connection-search-service" ]; then
        run_with_optional_testops "testConnectionSearchApiService"
        exit $?
      fi

      exit 0
  artifacts:
    when: always
    paths:
      - build/reports/
      - allure-results
    expire_in: 1 day

#Job for production smoke tests
job_test_smoke_production:
  timeout: 3 hours
  stage: test
  image: gradle:8.10.0-jdk22
  rules:
    - if: '$PROD_TESTS == "true"'
  variables:
    ALLURE_LAUNCH_NAME: "[Core team] Production smoke run at $CI_PIPELINE_CREATED_AT triggered by $APP_NAME"
    ALLURE_ENDPOINT: http://allure.vindex-test.risk-vantagefx.com/
    ALLURE_PROJECT_ID: 3
    ALLURE_RESULTS: allure-results
    RUNNER: "GITLAB_CI"
    TAG: 'team_core'
  before_script:
    - wget --output-document=allurectl --quiet https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
    - chmod +x allurectl
  script:
    - echo "Running tests"
    - ./gradlew installDeps
    - ./gradlew installChromium
    - ./allurectl watch -- gradle clean testSuiteSmokeProduction
    - echo "TEST SUCCESS"
  artifacts:
    when: always
    paths:
      - playwright-report
      - build/reports/
      - allure-results
      - test-output/videos
    expire_in: 1 day