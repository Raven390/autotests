stages:
  - build
  - test

job_build:
  stage: build
  image: gradle:8.10.0-jdk22
  script:
    - echo "Building the project"
    - ./gradlew installDeps
    - ./gradlew installChromium
    - ./gradlew build -x verifyGoogleJavaFormat
    - echo "SUCCESS"
  artifacts:
    when: always
    paths:
      - playwright-report
    expire_in: 1 day
