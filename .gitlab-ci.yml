stages:
  - build
  - test

job_build:
  stage: build
  image: gradle:8.10.0-jdk22
  script:
    - echo "Building the project"
    - ./gradlew clean
    - ./gradlew build -x spotlessCheck -x test
    - echo "SUCCESS"

job_code_check:
  stage: build
  needs: ["job_build"]
  image: gradle:8.10.0-jdk22
  script:
    - echo "Checking the code"
    - ./gradlew spotlessCheck
    - echo "SUCCESS"

job_test:
  stage: test
  needs: ["job_build"]
  image: gradle:8.10.0-jdk22
  script:
    - echo "Running tests"
    - ./gradlew clean
    - ./gradlew installDeps
    - ./gradlew installChromium
    - ./gradlew test -x spotlessCheck
    - echo "SUCCESS"
  artifacts:
    when: always
    paths:
      - playwright-report
      - build/reports/tests/test/index.html
    expire_in: 1 day