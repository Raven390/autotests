stages:
  - build
  - test

job_build:
  stage: build
  image: gradle:8.10.0-jdk22
  script:
    - echo "Building the project"
    - ./gradlew clean
    - ./gradlew build -x spotlessCheck -x test
    - echo "BUILD SUCCESS"

job_code_check:
  stage: build
  needs: ["job_build"]
  image: gradle:8.10.0-jdk22
  script:
    - echo "Checking the code"
    - ./gradlew spotlessCheck
    - echo "CODE CHECK SUCCESS"

job_test:
  stage: test
  needs: ["job_build"]
  image: gradle:8.10.0-jdk22
  variables:
    ALLURE_ENDPOINT: http://k8s-testops-95dbc1706b-543857133.us-east-1.elb.amazonaws.com/
    ALLURE_PROJECT_ID: 6
    ALLURE_RESULTS: allure-results
  before_script:
    - wget --output-document=allurectl --quiet https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
    - chmod +x allurectl
  script:
    - echo "Running tests"
    - ./gradlew installDeps
    - ./gradlew installChromium
    - ./allurectl watch -- gradle clean test
    - echo "TEST SUCCESS"
  artifacts:
    when: always
    paths:
      - playwright-report
      - build/reports/
      - allure-results
    expire_in: 1 day