stages:
  - build
  - test

workflow:
  rules:
   # Rule for nightly job
   - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_CORE_RUN == "true" && $CI_COMMIT_BRANCH == "main"'
     when: always
   - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_BACKOFFICE_RUN == "true" && $CI_COMMIT_BRANCH == "main"'
     when: always
   # Rule for jobs run on MR
   - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
     when: always  # Pipeline runs on merge requests
   # Push pipeline workflow (excluding main branch)
   - if: '$CI_COMMIT_BRANCH != "main" && $CI_PIPELINE_SOURCE == "push"'
     when: always  # Pipeline runs on non-main branch pushes
   # Default: Disable pipeline for other scenarios
   - when: never

job_build:
  stage: build
  image: gradle:8.10.0-jdk22
  script:
    - echo "Building the project"
    - ./gradlew clean
    - ./gradlew build -x test
    - echo "BUILD SUCCESS"

job_code_check:
  stage: build
  needs: ["job_build"]
  image: gradle:8.10.0-jdk22
  script:
    - echo "Checking the code"
    - ./gradlew spotlessCheck
    - echo "CODE CHECK SUCCESS"

job_run_minimal_tests:
  stage: test
  needs: ["job_build"]
  image: gradle:8.10.0-jdk22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH != "main" && $CI_PIPELINE_SOURCE == "push"'
  script:
    - echo "Run the minimal tests set to ensure that framework works"
    - ./gradlew installDeps
    - ./gradlew installChromium
    - ./gradlew testBuildCheck
    - echo "Run minimal tests set SUCCESS"

job_test_core:
  stage: test
  needs: ["job_build"]
  image: gradle:8.10.0-jdk22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_CORE_RUN == "true" && $CI_COMMIT_BRANCH == "main"'
  variables:
    ALLURE_ENDPOINT: http://allure.vindex-test.risk-vantagefx.com/
    ALLURE_PROJECT_ID: 3
    ALLURE_RESULTS: allure-results
    TAG: 'team_core'
  before_script:
    - wget --output-document=allurectl --quiet https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
    - chmod +x allurectl
  script:
    - echo "Running tests"
    - ./gradlew installDeps
    - ./gradlew installChromium
    - ./allurectl watch -- gradle clean testSmokeCore
    - echo "TEST SUCCESS"
  artifacts:
    when: always
    paths:
      - playwright-report
      - build/reports/
      - allure-results
      - test-output/videos
    expire_in: 1 day

job_test_backoffice:
  stage: test
  needs: ["job_build"]
  image: gradle:8.10.0-jdk22
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_BACKOFFICE_RUN == "true" && $CI_COMMIT_BRANCH == "main"'
  variables:
    ALLURE_ENDPOINT: http://allure.vindex-test.risk-vantagefx.com/
    ALLURE_PROJECT_ID: 4
    ALLURE_RESULTS: allure-results
  before_script:
    - wget --output-document=allurectl --quiet https://github.com/allure-framework/allurectl/releases/latest/download/allurectl_linux_amd64
    - chmod +x allurectl
  script:
    - echo "Running tests"
    - ./gradlew installDeps
    - ./gradlew installChromium
    - ./allurectl watch -- gradle clean testSmokeBackoffice
    - echo "TEST SUCCESS"
  artifacts:
    when: always
    paths:
      - playwright-report
      - build/reports/
      - allure-results
      - test-output/videos
    expire_in: 1 day